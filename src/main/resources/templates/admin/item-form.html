<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${item.id == null ? 'Dodaj Przedmiot' : 'Edytuj Przedmiot'} + ' | Admin Panel'">Formularz | Rent-A-Thing</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/home.css}" href="../css/style.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="../css/admin.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark shadow py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center" href="/admin/dashboard">
                <i class="fa-solid fa-layer-group text-primary me-2"></i> 
                Rent-A-Thing <span class="badge bg-primary fs-xs ms-2 text-uppercase ls-1">Admin</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav ms-4 me-auto align-items-center fw-medium">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Kokpit</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/inventory">Magazyn</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/rentals">Wypożyczenia</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/users">Użytkownicy</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 text-white mt-3 mt-lg-0">
                    <div class="d-none d-lg-block text-end lh-1">
                        <small class="d-block text-white-50 fs-xs">Administrator</small>
                        <span class="fw-bold">Jan Admin</span>
                    </div>
                    <form th:action="@{/logout}" method="post">
                         <button class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-4">
        <div class="container px-4">
            
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h2 class="fw-bold text-dark mb-0">
                            <i class="fa-solid me-2 text-primary" th:classappend="${item.id == null ? 'fa-plus-circle' : 'fa-pen-to-square'}"></i>
                            <span th:text="${item.id == null ? 'Dodaj Nowy Przedmiot' : 'Edytuj: ' + item.name}">Dodawanie nowego przedmiotu</span>
                        </h2>
                    </div>

                    <form th:action="@{/admin/inventory/save}" th:object="${item}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                            <div class="card-body p-4 p-lg-5">
                                
                                <div class="row g-4">
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted text-uppercase fw-bold">Zdjęcie produktu</label>
                                        
                                        <div class="image-upload-wrapper border rounded-4 mb-3 d-flex align-items-center justify-content-center bg-light position-relative overflow-hidden" 
                                             style="height: 250px;">
                                            
                                            <div id="placeholderIcon" class="text-center text-muted" th:classappend="${item.imageUrl != null ? 'd-none' : ''}">
                                                <i class="fa-solid fa-cloud-arrow-up fa-3x mb-2"></i>
                                                <p class="small mb-0">Kliknij, aby wgrać</p>
                                            </div>

                                            <img id="imagePreview" 
                                                 th:src="${item.imageUrl != null ? item.imageUrl : '#'}" 
                                                 class="img-fluid w-100 h-100 object-fit-cover position-absolute top-0 start-0" 
                                                 th:classappend="${item.imageUrl == null ? 'd-none' : ''}"
                                                 alt=" ">
                                                 
                                            <input type="file" class="form-control position-absolute top-0 start-0 w-100 h-100 opacity-0 cursor-pointer" 
                                                   id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(this)">
                                        </div>
                                        
                                        <div class="small text-muted text-center">
                                            Obsługiwane formaty: JPG, PNG. Max 5MB.
                                        </div>
                                    </div>

                                    <div class="col-md-8">
                                        <div class="row g-3">
                                            
                                            <div class="col-12">
                                                <label for="name" class="form-label small text-muted text-uppercase fw-bold">Nazwa przedmiotu</label>
                                                <input type="text" class="form-control form-control-lg rounded-3" id="name" th:field="*{name}" 
                                                       placeholder="np. Dron DJI Mavic 3" 
                                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                                <div class="invalid-feedback" th:errors="*{name}">Błąd nazwy</div>
                                            </div>

                                            <div class="col-md-6">
                                                <label for="category" class="form-label small text-muted text-uppercase fw-bold">Kategoria</label>
                                                <select class="form-select rounded-3" id="category" th:field="*{category}">
                                                    <option value="" disabled selected>Wybierz kategorię...</option>
                                                    <option value="1">Pojazdy</option>
                                                    <option value="2">Elektronika</option>
                                                    <option value="3">Narzędzia</option>
                                                </select>
                                            </div>

                                            <div class="col-md-6">
                                                <label for="price" class="form-label small text-muted text-uppercase fw-bold">Cena za dobę (PLN)</label>
                                                <div class="input-group">
                                                    <input type="number" step="0.01" min="0" class="form-control rounded-start-3" id="price" th:field="*{price}" placeholder="0.00">
                                                    <span class="input-group-text bg-light text-muted border-start-0 rounded-end-3">zł</span>
                                                </div>
                                            </div>

                                            <div class="col-md-6">
                                                <label for="status" class="form-label small text-muted text-uppercase fw-bold">Status początkowy</label>
                                                <select class="form-select rounded-3" id="status" th:field="*{status}">
                                                    <option value="AVAILABLE">Dostępny</option>
                                                    <option value="MAINTENANCE">W serwisie (Naprawa)</option>
                                                    <option value="ARCHIVED">Archiwum (Ukryty)</option>
                                                </select>
                                            </div>

                                            <div class="col-md-6">
                                                <label for="serialNumber" class="form-label small text-muted text-uppercase fw-bold">Numer Seryjny</label>
                                                <input type="text" class="form-control rounded-3" id="serialNumber" th:field="*{serialNumber}" placeholder="np. SN-2024-X99">
                                            </div>

                                            <div class="col-12">
                                                <label for="description" class="form-label small text-muted text-uppercase fw-bold">Opis techniczny</label>
                                                <textarea class="form-control rounded-3" id="description" th:field="*{description}" rows="5" 
                                                          placeholder="Szczegółowy opis, specyfikacja, zawartość zestawu..."></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="card-footer bg-white border-top border-light py-4 px-4 px-lg-5">
    <div class="d-flex flex-column flex-sm-row justify-content-end gap-3">
        
        <a href="/admin/inventory" class="btn btn-light rounded-pill px-4 w-100 w-sm-auto order-2 order-sm-1">
            Anuluj
        </a>

        <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm fw-medium w-100 w-sm-auto order-1 order-sm-2">
            <i class="fa-solid fa-check me-2"></i> Zapisz Przedmiot
        </button>
        
    </div>
</div>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white py-4 mt-auto border-top">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-between small text-muted">
                <div>&copy; 2024 Rent-A-Thing Admin System.</div>
                <div>Wsparcie: <a href="#" class="text-decoration-none">helpdesk@rentathing.pl</a></div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('placeholderIcon');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('d-none');
                    placeholder.classList.add('d-none');
                }
                
                reader.readAsDataURL(input.files[0]);
            } else {
                if(preview.getAttribute('src') === '#') {
                    preview.classList.add('d-none');
                    placeholder.classList.remove('d-none');
                }
            }
        }
    </script>
</body>
</html>
