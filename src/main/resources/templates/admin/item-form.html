<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head-admin :: admin-head('Dodawanie przedmiotu')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/nav-admin :: admin-nav('inventory')}"></nav>
<main class="py-4">
    <div class="container px-4">

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h2 class="fw-bold text-dark mb-0">
                        <i class="fa-solid me-2 text-primary" th:classappend="${item.id == null ? 'fa-plus-circle' : 'fa-pen-to-square'}"></i>
                        <span th:text="${item.id == null ? 'Dodaj Nowy Przedmiot' : 'Edytuj: ' + item.title}">Dodawanie nowego przedmiotu</span>
                    </h2>
                </div>

                <form th:action="@{/admin/inventory/save}" th:object="${item}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}">

                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <div class="card-body p-4 p-lg-5">

                            <div class="row g-4">
                                <div class="col-md-4">
                                    <label class="form-label small text-muted text-uppercase fw-bold">Zdjęcie produktu</label>

                                    <div class="image-upload-wrapper border rounded-4 mb-3 d-flex align-items-center justify-content-center bg-light position-relative overflow-hidden"
                                         style="height: 250px;">

                                        <div id="placeholderIcon" class="text-center text-muted" th:classappend="${item.imageUrl != null ? 'd-none' : ''}">
                                            <i class="fa-solid fa-cloud-arrow-up fa-3x mb-2"></i>
                                            <p class="small mb-0">Kliknij, aby wgrać</p>
                                        </div>

                                        <img id="imagePreview"
                                             th:src="${item.imageUrl != null ? item.imageUrl : '#'}"
                                             class="img-fluid w-100 h-100 object-fit-cover position-absolute top-0 start-0"
                                             th:classappend="${item.imageUrl == null ? 'd-none' : ''}"
                                             alt=" ">

                                        <input type="file" class="form-control position-absolute top-0 start-0 w-100 h-100 opacity-0 cursor-pointer"
                                               id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(this)">
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="row g-3">

                                        <div class="col-12">
                                            <label for="title" class="form-label small text-muted text-uppercase fw-bold">Nazwa przedmiotu</label>
                                            <input type="text" class="form-control form-control-lg rounded-3" id="title" th:field="*{title}"
                                                   placeholder="np. Dron DJI Mavic 3"
                                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:errors="*{title}">Błąd nazwy</div>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="category" class="form-label small text-muted text-uppercase fw-bold">Kategoria</label>
                                            <select class="form-select rounded-3" id="category" th:field="*{category}">
                                                <option value="" disabled selected>Wybierz kategorię...</option>
                                                <option th:each="cat : ${categories}"
                                                        th:value="${cat.id}"
                                                        th:text="${cat.name}">Elektronika</option>
                                            </select>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="pricePerDay" class="form-label small text-muted text-uppercase fw-bold">Cena za dobę (PLN)</label>
                                            <div class="input-group">
                                                <input type="number" step="0.01" min="0" class="form-control rounded-start-3" id="pricePerDay" th:field="*{pricePerDay}" placeholder="0.00">
                                                <span class="input-group-text bg-light text-muted border-start-0 rounded-end-3">zł</span>
                                            </div>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="available" class="form-label small text-muted text-uppercase fw-bold">Status dostępności</label>

                                            <select class="form-select rounded-3" id="available" name="available">

                                                <option value="true" th:selected="${item.available == true}">Dostępny dla klientów</option>
                                                <option value="false" th:selected="${item.available == false}">Ukryty / W serwisie</option>

                                            </select>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="sku" class="form-label small text-muted text-uppercase fw-bold">Kod SKU / Seryjny</label>
                                            <input type="text" class="form-control rounded-3" id="sku" th:field="*{sku}" placeholder="np. DRON-DJI-001">
                                        </div>

                                        <div class="col-12">
                                            <label for="description" class="form-label small text-muted text-uppercase fw-bold">Opis techniczny</label>
                                            <textarea class="form-control rounded-3" id="description" th:field="*{description}" rows="5"
                                                      placeholder="Szczegółowy opis..."></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white border-top border-light py-4 px-4 px-lg-5">
                            <div class="d-flex flex-column flex-sm-row justify-content-end gap-3">
                                <a th:href="@{/admin/magazyn}" class="btn btn-light rounded-pill px-4">Anuluj</a>
                                <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm fw-medium">
                                    <i class="fa-solid fa-check me-2"></i> Zapisz Przedmiot
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        const placeholder = document.getElementById('placeholderIcon');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('d-none');
                placeholder.classList.add('d-none');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
