<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head-admin :: admin-head('Nowe Wypożyczenie')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/nav-admin :: admin-nav('rentals')}"></nav>

<main class="py-4 flex-grow-1">
    <div class="container px-4" style="max-width: 900px;">

        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/admin/rentals}" class="btn btn-light rounded-pill me-3 shadow-sm">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0 text-dark">Rejestracja wypożyczenia</h2>
        </div>

        <form th:action="@{/admin/rentals/create}" method="post" th:object="${rentalDto}" id="bookingForm">

            <div th:if="${error}" class="alert alert-danger rounded-4 shadow-sm border-0">
                <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${error}"></span>
            </div>

            <div class="row g-4">
                <div class="col-12">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-user me-2"></i> Klient</h5>
                            <div class="position-relative mb-1" id="userSearchContainer">
                                <input type="text" class="form-control bg-light border-0 rounded-pill p-3"
                                       id="userSearchInput" placeholder="Szukaj: Imię, nazwisko, email..." autocomplete="off">
                                <ul class="dropdown-menu w-100 shadow-lg border-0 rounded-4 mt-1 overflow-hidden" id="userResults"></ul>
                            </div>
                            <div id="selectedUserCard" class="d-none bg-primary bg-opacity-10 p-3 rounded-4 border border-primary border-opacity-25 d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0 text-dark" id="selectedUserLabel"></h6>
                                        <small class="text-primary" id="selectedUserEmail"></small>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-sm btn-white text-danger border shadow-sm rounded-pill" onclick="resetUser()">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <input type="hidden" th:field="*{userId}" id="userIdInput">
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3 text-success"><i class="fa-solid fa-camera me-2"></i> Przedmiot</h5>
                            <div class="position-relative mb-1" id="itemSearchContainer">
                                <input type="text" class="form-control bg-light border-0 rounded-pill p-3"
                                       id="itemSearchInput" placeholder="Szukaj: Nazwa, SKU..." autocomplete="off">
                                <ul class="dropdown-menu w-100 shadow-lg border-0 rounded-4 mt-1 overflow-hidden" id="itemResults"></ul>
                            </div>
                            <div id="selectedItemCard" class="d-none bg-success bg-opacity-10 p-3 rounded-4 border border-success border-opacity-25 d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center">
                                    <img id="selectedItemImg" src="" class="rounded-3 me-3 border" style="width: 50px; height: 50px; object-fit: cover;">
                                    <div>
                                        <h6 class="fw-bold mb-0 text-dark" id="selectedItemTitle"></h6>
                                        <small class="text-success" id="selectedItemSku"></small>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-sm btn-white text-danger border shadow-sm rounded-pill" onclick="resetItem()">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <input type="hidden" th:field="*{itemId}" id="itemId">
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Szczegóły wynajmu</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Data wydania</label>
                                    <input type="date" th:field="*{startDate}" id="startDate" class="form-control bg-light border-0 rounded-3 p-3" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Planowany zwrot</label>
                                    <input type="date" th:field="*{endDate}" id="endDate" class="form-control bg-light border-0 rounded-3 p-3" required>
                                </div>
                            </div>

                            <div id="availability-status" class="alert d-flex align-items-center mt-3 d-none rounded-4 border-0" role="alert">
                                <i id="status-icon" class="fa-solid me-2"></i>
                                <div id="status-text" class="small fw-medium"></div>
                            </div>

                            <div class="row g-3 mt-1">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Metoda płatności</label>
                                    <select th:field="*{paymentMethod}" class="form-select bg-light border-0 rounded-3 p-3">
                                        <option value="CASH">Gotówka</option>
                                        <option value="CARD">Karta (Terminal)</option>
                                        <option value="BLIK">BLIK</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Dostawa</label>
                                    <select th:field="*{deliveryMethod}" id="deliveryMethod" class="form-select bg-light border-0 rounded-3 p-3">
                                        <option value="PICKUP">Odbiór osobisty</option>
                                        <option value="DELIVERY">Wysyłka (+25 zł)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 bg-dark text-white h-100">
                        <div class="card-body p-4 d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="fw-bold mb-4 text-white"><i class="fa-solid fa-receipt me-2 text-primary"></i>Podsumowanie</h5>

                                <div id="price-summary" class="d-none">
                                    <div class="d-flex justify-content-between mb-2 small text-muted">
                                        <span>Cena za dobę:</span>
                                        <span class="fw-bold text-white"><span id="summary-daily-rate">0.00</span> zł</span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-2 small text-muted">
                                        <span>Liczba dni:</span>
                                        <span class="fw-bold text-white"><span id="summary-days">0</span></span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-2 small text-muted">
                                        <span>Wynajem:</span>
                                        <span class="fw-bold text-white"><span id="summary-rental-price">0.00</span> zł</span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-2 small text-warning">
                                        <span>Kaucja (zwrotna):</span>
                                        <span class="fw-bold"><span id="summary-deposit">0.00</span> zł</span>
                                    </div>
                                    <hr class="border-secondary opacity-25">
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <span class="h6 mb-0 text-uppercase">Do zapłaty:</span>
                                        <span class="h4 mb-0 fw-bold text-primary"><span id="summary-total">0.00</span> zł</span>
                                    </div>
                                </div>

                                <div id="price-placeholder" class="text-center py-4 text-muted small">
                                    <i class="fa-solid fa-calculator d-block fs-2 mb-2 opacity-25"></i>
                                    Wybierz produkt i daty.
                                </div>

                                <hr class="border-secondary opacity-25 my-4">

                                <h6 class="fw-bold mb-3">Akcje</h6>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" th:field="*{markDepositPaid}" id="markDepositPaid">
                                    <label class="form-check-label small" for="markDepositPaid">Kaucja opłacona</label>
                                </div>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-lg">
                                <i class="fa-solid fa-check me-2"></i> Utwórz wynajem
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/rental/admin-rental-create.js}"></script>

<footer th:replace="~{fragments/footer-admin :: footer-admin}"></footer>
</body>
</html>
