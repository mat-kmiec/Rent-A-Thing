<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav class="navbar navbar-expand-lg fixed-top navbar-light bg-white shadow-sm py-3" th:fragment="nav">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-3" th:href="@{/}">
            <i class="fa-solid fa-layer-group"></i> Rent-A-Thing
        </a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center fw-medium mt-3 mt-lg-0">
                <li class="nav-item"><a class="nav-link px-3" href="#categories">Kategorie</a></li>
                <li class="nav-item"><a class="nav-link px-3" href="#featured">Oferta</a></li>
                <li class="nav-item"><a class="nav-link px-3 text-nowrap" href="#how-it-works">Jak to działa</a></li>

                <th:block sec:authorize="isAnonymous()">
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0 w-100 w-lg-auto">
                        <a th:href="@{/logowanie}" class="btn btn-outline-primary px-4 rounded-pill w-100 w-lg-auto text-nowrap">Logowanie</a>
                    </li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0 w-100 w-lg-auto">
                        <a th:href="@{/rejestracja}" class="btn btn-primary px-4 rounded-pill shadow-sm w-100 w-lg-auto text-nowrap">Dołącz teraz</a>
                    </li>
                </th:block>

                <th:block sec:authorize="isAuthenticated()">

                    <li sec:authorize="hasRole('ADMIN')" class="nav-item ms-lg-3 mt-3 mt-lg-0 w-100 w-lg-auto">
                        <a th:href="@{/admin/dashboard}" class="btn btn-dark px-4 rounded-pill w-100 w-lg-auto text-nowrap">
                            <i class="fa-solid fa-lock me-1"></i> Panel Admina
                        </a>
                    </li>

                    <li sec:authorize="hasRole('USER')" class="nav-item ms-lg-3 mt-3 mt-lg-0 w-100 w-lg-auto">
                        <a th:href="@{/panel}" class="btn btn-outline-secondary px-4 rounded-pill w-100 w-lg-auto text-nowrap">
                            <i class="fa-solid fa-user me-1"></i> Moje Konto
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0 w-100 w-lg-auto">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-danger px-4 rounded-pill shadow-sm w-100 w-lg-auto text-nowrap">
                                <i class="fa-solid fa-right-from-bracket me-1"></i> Wyloguj
                            </button>
                        </form>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
</html>
