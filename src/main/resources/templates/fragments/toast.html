<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100" th:fragment="toast">
    <div id="liveToast" class="toast align-items-center text-white border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i id="toastIcon" class="me-2"></i>
                <span id="toastMessage"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>
</html>
