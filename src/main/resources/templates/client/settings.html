<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ustawienia Konta')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav th:replace="~{fragments/nav :: nav}"></nav>

    <section>
        <div class="container py-4">
            <div class="row g-4">

                <div th:replace="~{fragments/user-sidebar :: sidebar('settings')}"></div>

                <div class="col-lg-9">
                    <h4 class="fw-bold mb-4">Ustawienia Konta</h4>

                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4 mb-4" role="alert">
                        <i class="fa-solid fa-check-circle me-2"></i>
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-header bg-white p-4 border-bottom">
                            <h6 class="fw-bold mb-0 text-primary">Dane osobowe</h6>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/moje-konto/ustawienia/profile}" th:object="${settings}" method="post" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted fw-bold">Imię</label>
                                        <input type="text" class="form-control" th:field="*{firstName}" 
                                               th:classappend="${#fields.hasErrors('firstName') ? 'is-invalid' : ''}">
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted fw-bold">Nazwisko</label>
                                        <input type="text" class="form-control" th:field="*{lastName}"
                                               th:classappend="${#fields.hasErrors('lastName') ? 'is-invalid' : ''}">
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label small text-muted fw-bold">Adres Email</label>
                                        <input type="email" class="form-control" th:field="*{email}"
                                               th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}">
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    </div>
                                    <div class="col-12 text-end mt-4">
                                        <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Zapisz dane</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-header bg-white p-4 border-bottom">
                            <h6 class="fw-bold mb-0 text-primary">Adres domyślny (do wysyłki)</h6>
                        </div>
                        <div class="card-body p-4">
                            <form>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label small text-muted fw-bold">Ulica i numer</label>
                                        <input type="text" class="form-control" placeholder="np. Kwiatowa 15/3">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small text-muted fw-bold">Kod pocztowy</label>
                                        <input type="text" class="form-control" placeholder="00-000">
                                    </div>
                                    <div class="col-md-8">
                                        <label class="form-label small text-muted fw-bold">Miasto</label>
                                        <input type="text" class="form-control" placeholder="Warszawa">
                                    </div>
                                    <div class="col-12 text-end mt-4">
                                        <button class="btn btn-outline-primary rounded-pill px-4">Zaktualizuj adres</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-header bg-white p-4 border-bottom">
                            <h6 class="fw-bold mb-0 text-primary">Zmiana hasła</h6>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/client/settings}" th:object="${settings}" method="post" novalidate>
                                <input type="hidden" th:field="*{firstName}">
                                <input type="hidden" th:field="*{lastName}">
                                <input type="hidden" th:field="*{email}">
                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label class="form-label small text-muted fw-bold">Aktualne hasło</label>
                                        <input type="password" class="form-control" th:field="*{currentPassword}"
                                               th:classappend="${#fields.hasErrors('currentPassword') ? 'is-invalid' : ''}">
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted fw-bold">Nowe hasło</label>
                                        <input type="password" class="form-control" th:field="*{newPassword}"
                                               th:classappend="${#fields.hasErrors('newPassword') ? 'is-invalid' : ''}">
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted fw-bold">Powtórz nowe hasło</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <div class="col-12 text-end mt-4">
                                        <button type="submit" class="btn btn-outline-primary rounded-pill px-4">Zmień hasło</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white p-4 border-bottom">
                            <h6 class="fw-bold mb-0 text-primary">Preferencje powiadomień</h6>
                        </div>
                        <div class="card-body p-4">
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="notifEmail" checked>
                                <label class="form-check-label" for="notifEmail">Powiadomienia o statusie zamówienia (Email)</label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="notifSms">
                                <label class="form-check-label" for="notifSms">Powiadomienia SMS</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="newsletter">
                                <label class="form-check-label" for="newsletter">Newsletter i promocje</label>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
