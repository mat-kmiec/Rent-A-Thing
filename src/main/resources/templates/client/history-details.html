<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Szczegóły wypożyczenia')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<section class="flex-grow-1">
    <div class="container py-4">
        <div class="row g-4">
            <div th:replace="~{fragments/user-sidebar :: sidebar('history')}"></div>

            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">Szczegóły zamówienia <span class="text-muted" th:text="'#' + ${rental.id}"></span></h4>
                    <span class="badge rounded-pill px-3 py-2 bg-opacity-10"
                          th:classappend="${rental.status.badgeClass}"
                          th:text="${rental.status.displayName}">Status</span>
                </div>

                <div class="row g-4">
                    <div class="col-md-7">
                        <div class="card border-0 shadow-sm rounded-4 mb-4">
                            <div class="card-body p-4">
                                <h6 class="fw-bold mb-3 border-bottom pb-2">Przedmiot</h6>
                                <div class="d-flex align-items-center mb-4">
                                    <img th:src="${rental.itemImageUrl}" class="rounded-3 me-3" style="width: 80px; height: 80px; object-fit: cover;">
                                    <div>
                                        <h5 class="fw-bold mb-1" th:text="${rental.itemTitle}">Nazwa</h5>
                                    </div>
                                </div>

                                <h6 class="fw-bold mb-3 border-bottom pb-2">Czas trwania</h6>
                                <div class="row text-center bg-light rounded-4 py-3 g-0">
                                    <div class="col border-end">
                                        <small class="text-muted d-block">Od</small>
                                        <span class="fw-bold" th:text="${#temporals.format(rental.startDateTime, 'dd.MM.yyyy HH:mm')}"></span>
                                    </div>
                                    <div class="col">
                                        <small class="text-muted d-block">Do</small>
                                        <span class="fw-bold" th:text="${#temporals.format(rental.endDateTime, 'dd.MM.yyyy HH:mm')}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card border-0 shadow-sm rounded-4" th:if="${rental.handOverNotes != null || rental.returnNotes != null}">
                            <div class="card-body p-4">
                                <h6 class="fw-bold mb-3">Uwagi do wypożyczenia</h6>
                                <div th:if="${rental.handOverNotes}" class="mb-3">
                                    <small class="text-muted">Przy wydaniu:</small>
                                    <p class="small mb-0 fst-italic" th:text="${rental.handOverNotes}"></p>
                                </div>
                                <div th:if="${rental.returnNotes}">
                                    <small class="text-muted">Przy zwrocie:</small>
                                    <p class="small mb-0 fst-italic" th:text="${rental.returnNotes}"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <div class="card border-0 shadow-sm rounded-4 bg-white">
                            <div class="card-body p-4">
                                <h6 class="fw-bold mb-3">Podsumowanie płatności</h6>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">Koszt najmu:</span>
                                    <span class="fw-medium" th:text="${#numbers.formatDecimal(rental.totalCost, 1, 2)} + ' zł'"></span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">Kaucja:</span>
                                    <span class="fw-medium text-primary" th:text="${#numbers.formatDecimal(rental.deposit, 1, 2)} + ' zł'"></span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">Wysyłka:</span>
                                    <span class="fw-medium" th:text="${#numbers.formatDecimal(rental.shippingCost, 1, 2)} + ' zł'"></span>
                                </div>
                                <hr>
                                <div class="d-flex justify-content-between align-items-center mb-0">
                                    <span class="fw-bold">Suma:</span>
                                    <h4 class="fw-bold text-dark mb-0"
                                        th:text="${#numbers.formatDecimal(rental.totalCost + (rental.deposit ?: 0) + (rental.shippingCost ?: 0), 1, 2)} + ' zł'">
                                    </h4>
                                </div>

                                <div class="mt-4 pt-3 border-top small">
                                    <div class="d-flex align-items-center mb-2">
                                        <i class="fa-solid fa-truck text-muted me-2"></i>
                                        <span th:text="'Dostawa: ' + ${rental.deliveryMethod}"></span>
                                    </div>
                                    <div class="d-flex align-items-center mb-2">
                                        <i class="fa-solid fa-credit-card text-muted me-2"></i>
                                        <span th:text="'Płatność: ' + ${rental.paymentMethod}"></span>
                                    </div>
                                    <div class="d-flex align-items-center" th:if="${rental.depositPaid}">
                                        <i class="fa-solid fa-check-circle text-success me-2"></i>
                                        <span class="text-success fw-bold">Kaucja opłacona</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
