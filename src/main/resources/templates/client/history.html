<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Historia zamówień')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<section class="flex-grow-1">
    <div class="container py-4">
        <div class="row g-4">

            <div th:replace="~{fragments/user-sidebar :: sidebar('history')}"></div>

            <div class="col-lg-9">
                <h4 class="fw-bold mb-4">Historia Wypożyczeń</h4>

                <form th:action="@{/moje-konto/historia}" method="get" id="filterForm">
                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-body p-3">
                            <div class="row g-2 align-items-center">
                                <div class="col-md-5">
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                                        <input type="text" name="search" th:value="${search}"
                                               class="form-control bg-light border-0 shadow-none"
                                               placeholder="Szukaj po nazwie lub nr zam...">
                                    </div>
                                </div>
                                <div class="col-6 col-md-3">
                                    <select name="status" class="form-select bg-light border-0 shadow-none cursor-pointer" onchange="this.form.submit()">
                                        <option value="" th:selected="${status == null || status == ''}">Status: Wszystkie</option>
                                        <option th:each="st : ${T(pl.rentathing.Rental.Entity.RentalStatus).values()}"
                                                th:value="${st.name()}"
                                                th:selected="${status == st.name()}"
                                                th:text="${st.displayName}">Status</option>
                                    </select>
                                </div>
                                <div class="col-6 col-md-4 text-end">
                                    <select name="sort" class="form-select bg-light border-0 shadow-none cursor-pointer d-inline-block w-auto" onchange="this.form.submit()">
                                        <option value="desc" th:selected="${sort == 'desc'}">Od najnowszych</option>
                                        <option value="asc" th:selected="${sort == 'asc'}">Od najstarszych</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-nowrap">
                            <thead class="bg-light text-uppercase small text-muted">
                            <tr>
                                <th class="ps-4 py-3 border-0">Przedmiot</th>
                                <th class="py-3 border-0">Data (Od - Do)</th>
                                <th class="py-3 border-0">Koszt</th>
                                <th class="py-3 border-0">Status</th>
                                <th class="text-end pe-4 py-3 border-0">Akcja</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="rental : ${rentals}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <img th:src="${rental.itemImageUrl}"
                                             class="history-thumb me-3" th:alt="${rental.itemTitle}">
                                        <div>
                                            <span class="d-block fw-bold text-dark" th:text="${rental.itemTitle}">Nazwa przedmiotu</span>
                                            <small class="text-muted" th:text="'#' + ${rental.id}">#ID</small>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="small">
                                        <div class="fw-medium" th:text="${#temporals.format(rental.startDateTime, 'dd MMM yyyy')}">Data Od</div>
                                        <div class="text-muted" th:text="${#temporals.format(rental.endDateTime, 'dd MMM yyyy')}">Data Do</div>
                                    </div>
                                </td>
                                <td class="fw-bold text-dark" th:text="${#numbers.formatDecimal(rental.totalCost, 1, 'DEFAULT', 2, 'DEFAULT')} + ' zł'">0.00 zł</td>
                                <td>
        <span class="badge rounded-pill px-3 bg-opacity-10"
              th:classappend="${rental.status.badgeClass}"
              th:text="${rental.status.displayName}">Status</span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/moje-konto/historia/szczegoly/{id}(id=${rental.id})}"
                                       class="btn btn-sm btn-white border shadow-sm rounded-pill px-3">Szczegóły</a>
                                </td>
                            </tr>

                            <tr th:if="${rentals == null || rentals.isEmpty()}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    Brak wypożyczeń spełniających kryteria.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card-footer bg-white border-top border-light py-3 px-4" th:if="${totalPages > 1}">
                        <div class="d-flex justify-content-end">
                            <nav>
                                <ul class="pagination pagination-sm mb-0">
                                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                        <a class="page-link" th:href="@{/moje-konto/historia(page=${currentPage - 1}, search=${search}, status=${status}, sort=${sort})}">
                                            <i class="fa-solid fa-chevron-left"></i>
                                        </a>
                                    </li>

                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${currentPage == i ? 'active' : ''}">
                                        <a class="page-link"
                                           th:href="@{/moje-konto/historia(page=${i}, search=${search}, status=${status}, sort=${sort})}"
                                           th:text="${i + 1}">1</a>
                                    </li>

                                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                                        <a class="page-link" th:href="@{/moje-konto/historia(page=${currentPage + 1}, search=${search}, status=${status}, sort=${sort})}">
                                            <i class="fa-solid fa-chevron-right"></i>
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
