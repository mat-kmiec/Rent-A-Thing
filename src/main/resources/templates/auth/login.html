<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Logowanie')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav th:replace="~{fragments/nav :: nav}"></nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center pt-5 pb-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    
                    <div class="card border-0 shadow-sm rounded-4 bg-white">
                        <div class="card-body p-4 p-md-5">
                            
                            <div class="text-center mb-4">
                                <h3 class="fw-bold text-primary mb-2">Witaj ponownie!</h3>
                                <p class="text-muted small">Zaloguj się, aby zarządzać wypożyczeniami.</p>
                            </div>

                            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center small py-2" role="alert">
                                <i class="fa-solid fa-circle-exclamation me-2"></i>
                                <div>Błędny login lub hasło.</div>
                            </div>

                            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center small py-2" role="alert">
                                <i class="fa-solid fa-check-circle me-2"></i>
                                <div>Zostałeś wylogowany.</div>
                            </div>

                            <form th:action="@{/login}" method="post">
                                
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control rounded-3 shadow-none border-light-subtle" id="username" name="username" placeholder="name@example.com" required autofocus>
                                    <label for="username" class="text-muted">Adres email</label>
                                </div>

                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control rounded-3 shadow-none border-light-subtle" id="password" name="password" placeholder="Hasło" required>
                                    <label for="password" class="text-muted">Hasło</label>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-4 small">
                                    <div class="form-check">
                                        <input class="form-check-input shadow-none" type="checkbox" id="rememberMe" name="remember-me">
                                        <label class="form-check-label text-muted" for="rememberMe">
                                            Zapamiętaj mnie
                                        </label>
                                    </div>
                                    <a href="#" class="text-decoration-none text-primary fw-medium">Nie pamiętasz hasła?</a>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-medium shadow-sm">
                                    Zaloguj się
                                </button>
                            </form>

                            <div class="text-center mt-4 small">
                                <span class="text-muted">Nie masz jeszcze konta?</span>
                                <a href="/auth/register" class="text-decoration-none fw-bold text-primary ms-1">Zarejestruj się</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
