<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Rejestracja')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav th:replace="~{fragments/nav :: nav}"></nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center pt-5 pb-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    
                    <div class="card border-0 shadow-sm rounded-4 bg-white">
                        <div class="card-body p-4 p-md-5">
                            
                            <div class="text-center mb-4">
                                <h3 class="fw-bold text-primary mb-2">Załóż konto</h3>
                                <p class="text-muted small">Dołącz do społeczności i wypożyczaj bez granic.</p>
                            </div>

                            <div th:if="${registrationError}" class="alert alert-danger d-flex align-items-center small py-2 mb-4" role="alert">
                                <i class="fa-solid fa-circle-exclamation me-2"></i>
                                <div th:text="${registrationError}">Wystąpił błąd rejestracji.</div>
                            </div>

                            <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                                
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control rounded-3 shadow-none border-light-subtle" 
                                                   id="firstName" th:field="*{firstName}" 
                                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                                                   placeholder="Imię">
                                            <label for="firstName" class="text-muted">Imię</label>
                                            <div class="invalid-feedback" th:errors="*{firstName}">Błąd imienia</div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control rounded-3 shadow-none border-light-subtle" 
                                                   id="lastName" th:field="*{lastName}"
                                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                                                   placeholder="Nazwisko">
                                            <label for="lastName" class="text-muted">Nazwisko</label>
                                            <div class="invalid-feedback" th:errors="*{lastName}">Błąd nazwiska</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control rounded-3 shadow-none border-light-subtle" 
                                           id="email" th:field="*{email}"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           placeholder="name@example.com">
                                    <label for="email" class="text-muted">Adres email</label>
                                    <div class="invalid-feedback" th:errors="*{email}">Błędny email</div>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control rounded-3 shadow-none border-light-subtle" 
                                           id="password" th:field="*{password}"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                           placeholder="Hasło">
                                    <label for="password" class="text-muted">Hasło</label>
                                    <div class="invalid-feedback" th:errors="*{password}">Hasło jest wymagane</div>
                                </div>

                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control rounded-3 shadow-none border-light-subtle" 
                                           id="confirmPassword" name="confirmPassword"
                                           placeholder="Powtórz hasło">
                                    <label for="confirmPassword" class="text-muted">Powtórz hasło</label>
                                </div>

                                <div class="form-check mb-4 small">
                                    <input class="form-check-input shadow-none" type="checkbox" id="terms">
                                    <label class="form-check-label text-muted" for="terms">
                                        Akceptuję <a href="#" class="text-decoration-none text-primary">Regulamin</a> oraz <a href="#" class="text-decoration-none text-primary">Politykę Prywatności</a>.
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-medium shadow-sm">
                                    Zarejestruj się
                                </button>
                            </form>

                            <div class="text-center mt-4 small">
                                <span class="text-muted">Masz już konto?</span>
                                <a href="/auth/login" class="text-decoration-none fw-bold text-primary ms-1">Zaloguj się</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
