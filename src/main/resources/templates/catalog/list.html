<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Katalog przedmiotów')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav th:replace="~{fragments/nav :: nav}"></nav>

    <header class="bg-primary text-white py-5 mt-5">
        <div class="container py-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="fw-bold display-5 mb-2">Katalog Przedmiotów</h1>
                    <p class="lead opacity-75 mb-0">Znajdź to, czego potrzebujesz, wypożycz i oszczędzaj.</p>
                </div>
                <div class="col-md-6 mt-4 mt-md-0">
                    <form th:action="@{/katalog}" method="get">
                        <div class="input-group input-group-lg bg-white rounded-pill p-1 shadow-sm">
                            <span class="input-group-text border-0 bg-transparent ps-4"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" name="query" th:value="${criteria.query}"
                                   class="form-control border-0 shadow-none fs-6"
                                   placeholder="Szukaj (np. Wiertarka, Dron)...">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Szukaj</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                
                <div class="col-lg-3">
                    <form th:action="@{/katalog}" method="get" th:object="${criteria}">
                        <input type="hidden" name="query" th:field="*{query}">

                        <div class="card border-0 shadow-sm rounded-4 filter-card">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="fw-bold mb-0">Filtrowanie</h5>
                                    <a th:href="@{/katalog}" class="text-decoration-none small text-muted">Wyczyść</a>
                                </div>

                                <div class="mb-4">
                                    <h6 class="fw-bold text-uppercase small text-muted mb-3 ls-2">Kategorie</h6>

                                    <div th:each="cat : ${categories}" class="filter-category-row">
                                        <input class="form-check-input shadow-none" type="radio"
                                               name="categoryId"
                                               th:value="${cat.id}"
                                               th:id="${'cat' + cat.id}"
                                               th:checked="${cat.id == criteria.categoryId}">

                                        <label class="form-check-label" th:for="${'cat' + cat.id}">
                                            <span th:text="${cat.name}">Nazwa Kategorii</span>
                                            <span class="category-count" th:text="${cat.itemCount}">0</span>
                                        </label>
                                    </div>
                                </div>

                                <hr class="text-muted opacity-25">

                                <div class="mb-4">
                                    <h6 class="fw-bold text-uppercase small text-muted mb-3 ls-2">Cena za dobę</h6>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="number" step="0.01" th:field="*{priceFrom}"
                                                   class="form-control bg-light border-0 shadow-none" placeholder="Od zł">
                                        </div>
                                        <div class="col-6">
                                            <input type="number" step="0.01" th:field="*{priceTo}"
                                                   class="form-control bg-light border-0 shadow-none" placeholder="Do zł">
                                        </div>
                                    </div>
                                </div>

                                <hr class="text-muted opacity-25">

                                <div class="mb-4">
                                    <h6 class="fw-bold text-uppercase small text-muted mb-3 ls-2">Status</h6>
                                    <div class="filter-status-row mt-2">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input shadow-none" type="checkbox" role="switch"
                                                   th:field="*{availableOnly}" id="availCheck">
                                            <label class="form-check-label" for="availCheck">Tylko dostępne</label>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 rounded-pill shadow-sm">Zastosuj filtry</button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="col-lg-9">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm border border-light">
        <span class="text-muted mb-2 mb-md-0 ms-2">
            Znaleziono <strong th:text="${items.totalElements}">124</strong> przedmioty
        </span>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6 col-lg-4" th:each="item : ${items.content}">
                            <div class="card h-100 border-0 shadow-sm product-card" th:classappend="${!item.available} ? 'opacity-75' : ''">
                                <div class="position-relative">
                    <span th:if="${item.discountedPercent > 0}" class="badge bg-danger position-absolute top-0 start-0 m-3 shadow-sm"
                          th:text="${'-' + item.discountedPercent + '%'}">-20%</span>

                                    <span th:if="${!item.available}" class="badge bg-secondary position-absolute top-0 start-0 m-3 shadow-sm">Niedostępny</span>

                                    <img th:src="${item.imageUrl}" class="card-img-top rounded-top-4"
                                         th:alt="${item.title}" style="height: 220px; object-fit: cover;"
                                         th:styleappend="${!item.available} ? 'filter: grayscale(100%);' : ''">
                                </div>
                                <div class="card-body">
                                    <small class="text-muted text-uppercase fw-bold fs-xs ls-1" th:text="${item.category.name}">Kategoria</small>
                                    <h5 class="card-title fw-bold mt-1 mb-3" th:text="${item.title}">Tytuł</h5>

                                    <div class="d-flex justify-content-between align-items-end">
                                        <div>
                                            <div class="text-warning small mb-1">
                                                <i class="fa-solid fa-star"></i>
                                                <span th:text="${item.averageRating}">4.8</span>
                                                <span th:text="'(' + ${item.reviewCount} + ')'">(0)</span>
                                            </div>
                                            <span class="h5 mb-0 text-primary fw-bold" th:text="${item.pricePerDay + ' zł'}">45 zł</span>
                                            <small class="text-muted">/dzień</small>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer bg-white border-0 pb-4 pt-0">
                                    <a th:if="${item.available}" th:href="@{/przedmiot/{id}(id=${item.id})}"
                                       class="btn btn-outline-primary w-100 rounded-pill fw-medium">Zobacz szczegóły</a>
                                    <button th:unless="${item.available}" class="btn btn-light w-100 rounded-pill fw-medium text-muted" disabled>Chwilowo brak</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 d-flex justify-content-center" th:if="${items.totalPages > 1}">
                        <nav aria-label="Page navigation">
                            <ul class="pagination">
                                <li class="page-item" th:classappend="${items.first} ? 'disabled'">
                                    <a class="page-link rounded-start-pill border-0 shadow-sm mx-1"
                                       th:href="@{/katalog(page=${items.number - 1}, query=${criteria.query}, categoryId=${criteria.categoryId}, priceFrom=${criteria.priceFrom}, priceTo=${criteria.priceTo})}">
                                        <i class="fa-solid fa-chevron-left"></i>
                                    </a>
                                </li>

                                <li class="page-item" th:each="i : ${#numbers.sequence(0, items.totalPages - 1)}">
                                    <a class="page-link border-0 shadow-sm mx-1"
                                       th:href="@{/katalog(page=${i}, query=${criteria.query}, categoryId=${criteria.categoryId}, priceFrom=${criteria.priceFrom}, priceTo=${criteria.priceTo})}"
                                       th:text="${i + 1}"
                                       th:classappend="${i == items.number} ? 'active bg-primary text-white' : 'text-dark'">1</a>
                                </li>

                                <li class="page-item" th:classappend="${items.last} ? 'disabled'">
                                    <a class="page-link rounded-end-pill border-0 shadow-sm mx-1 text-dark"
                                       th:href="@{/katalog(page=${items.number + 1}, query=${criteria.query}, categoryId=${criteria.categoryId}, priceFrom=${criteria.priceFrom}, priceTo=${criteria.priceTo})}">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
