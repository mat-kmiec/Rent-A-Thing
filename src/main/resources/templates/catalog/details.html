<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Szczegóły produktu')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav th:replace="~{fragments/nav :: nav}"></nav>

<section class="py-5 ">
    <div class="container py-4">
        <div class="row g-5">
            <div class="col-lg-8">
                <div class="mb-5">
                    <div class="position-relative">
                        <div class="position-absolute top-0 start-0 m-3 d-flex gap-2" style="z-index: 10;">
                            <span class="badge bg-success fs-6 px-3 py-2 rounded-pill shadow-sm" th:if="${item.available}">
                                Dostępny od ręki
                            </span>
                            <span class="badge bg-primary fs-6 px-3 py-2 rounded-pill shadow-sm" th:if="${item.isNew}">
                                Nowość
                            </span>
                            <span class="badge bg-danger fs-6 px-3 py-2 rounded-pill shadow-sm"
                                  th:if="${item.discountedPercent > 0}" th:text="'-'+${item.discountedPercent}+'%'">
                            </span>
                        </div>
                        <img th:src="${item.imageUrl}"
                             class="img-fluid rounded-4 shadow-sm product-image-single"
                             alt="Main Image">
                    </div>
                </div>

                <div class="mb-2">
                    <h1 class="fw-bold mb-1 display-6" th:text="${item.title}"></h1>
                    <div class="text-warning small mb-3">
                        <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                            <i th:if="${item.averageRating >= i}" class="fa-solid fa-star"></i>

                            <i th:if="${item.averageRating >= i - 0.5 && item.averageRating < i}" class="fa-solid fa-star-half-stroke"></i>

                            <i th:if="${item.averageRating < i - 0.5}" class="fa-regular fa-star"></i>
                        </th:block>

                        <span class="text-muted ms-2 fw-medium"
                              th:text="'(' + ${item.averageRating} + ' / ' + ${item.reviewCount} + ' opinii)'"></span>
                    </div>
                </div>

                <div class="mb-5">
                    <h4 class="fw-bold mb-3">Opis produktu</h4>
                    <p class="text-muted" th:utext="${item.description}"></p>
                </div>

                <hr class="my-5 border-secondary opacity-10">

                <div id="reviews">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h4 class="fw-bold mb-0" th:text="|Opinie użytkowników (${item.reviewCount})|"></h4>
                        <button class="btn btn-outline-primary btn-sm rounded-pill px-3"
                                data-bs-toggle="modal"
                                data-bs-target="#addReviewModal">
                            Dodaj opinię
                        </button>
                    </div>
                    <div id="reviews-list"></div>
                    <div class="text-center mt-4">
                        <button id="load-more-reviews"
                                class="btn btn-link text-decoration-none text-muted"
                                th:data-item-id="${item.id}"
                                data-page="0">
                            Załaduj więcej opinii
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow rounded-4 booking-card">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
                            <div>
                                <small class="text-muted text-uppercase fw-bold ls-1">Cena</small>
                                <h2 class="text-primary fw-bold mb-0">
                                    <span id="priceDisplay"
                                          th:data-price="${item.pricePerDay}"
                                          th:text="${item.pricePerDay} + ' zł'"></span>
                                    <span class="fs-6 text-muted fw-normal">/doba</span>
                                </h2>
                            </div>
                            <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3 py-2"
                                  th:if="${item.available}">Dostępny</span>
                        </div>

                        <form id="booking-preview-form">
                            <input type="hidden" id="itemId" th:value="${item.id}">

                            <div class="mb-3">
                                <label class="form-label small text-muted fw-bold text-uppercase ls-1">Termin wypożyczenia</label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <label for="startDate" class="form-label small text-muted mb-1">Od</label>
                                        <input type="date" id="startDate" class="form-control bg-light border-0 shadow-none">
                                    </div>
                                    <div class="col-6">
                                        <label for="endDate" class="form-label small text-muted mb-1">Do</label>
                                        <input type="date" id="endDate" class="form-control bg-light border-0 shadow-none">
                                    </div>
                                </div>

                                <div id="availability-status" class="alert d-flex align-items-center mt-3 d-none" role="alert">
                                    <i id="status-icon" class="fa-solid me-2"></i>
                                    <div id="status-text" class="small fw-medium"></div>
                                </div>
                            </div>


                            <div id="rental-summary-container" class="bg-light p-3 rounded-3 mb-4">
                                <div class="text-center text-muted small py-2">
                                    Wybierz daty, aby zobaczyć wycenę
                                </div>
                            </div>
                            <p class="text-center text-muted small mb-3" th:if="${item.discountedPercent > 0}">Zniżki naliczają się podczas finalizacji rezerwacji.
                            </p>

                            <a id="reserveBtn"
                               href="#"
                               class="btn btn-primary w-100 btn-lg rounded-pill shadow-sm fw-bold mb-3 disabled">
                                Rezerwuję
                            </a>
                            <p class="text-center text-muted small mb-0">
                                <i class="fa-solid fa-shield-halved me-1"></i> Nie zostaniesz jeszcze obciążony.
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<div class="modal fade" id="addReviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Dodaj opinię</h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="reviewForm">
                    <div class="mb-3">
                        <label for="reviewAuthor" class="form-label small fw-bold">Twoje imię</label>
                        <input type="text" class="form-control bg-light border-0 shadow-none" id="reviewAuthor" required>
                    </div>

                    <div class="mb-3">
                        <label for="reviewRating" class="form-label small fw-bold">Ocena (1-5)</label>
                        <select class="form-select bg-light border-0 shadow-none" id="reviewRating" required>
                            <option value="5">5 - Świetny</option>
                            <option value="4">4 - Dobry</option>
                            <option value="3">3 - Przeciętny</option>
                            <option value="2">2 - Słaby</option>
                            <option value="1">1 - Bardzo słaby</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="reviewContent" class="form-label small fw-bold">Komentarz</label>
                        <textarea class="form-control bg-light border-0 shadow-none" id="reviewContent" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 shadow-sm">
                        Opublikuj opinię
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<script th:src="@{/js/review/addReview.js}"></script>
<script th:src="@{/js/review/loadReview.js}"></script>
<script th:src="@{/js/rental/check-availability.js}"></script>
<script th:src="@{/js/rental/rental-preview-calculator.js}"></script>

</body>
</html>
